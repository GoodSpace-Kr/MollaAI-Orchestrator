name: Build and Push Orchestrator Image

on:
  push:
    branches: ["main"]

env:
  DOCKERHUB_REPO: goodspace/molla-orchestrator
  DOCKERHUB_BASE_REPO: goodspace/molla-orchestrator-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Decide whether base image changed
        id: base_changed
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" | grep -Eq '^(Dockerfile.base|requirements.txt)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        if: steps.base_changed.outputs.changed == 'true'
        run: |
          docker build -f Dockerfile.base \
            -t ${{ env.DOCKERHUB_BASE_REPO }}:py311 .
          docker push ${{ env.DOCKERHUB_BASE_REPO }}:py311

      - name: Build and push app image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_REPO }}:${{ github.sha }} \
            -t ${{ env.DOCKERHUB_REPO }}:latest .
          docker push ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_REPO }}:latest
